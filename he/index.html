<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vellum — Vellum</title>
  <meta name="description" content="Vellum — אפליקציית כמוסת זמן להודעות קול ווידאו לעתיד.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600&display=swap');

    :root {
      --bg: #faf8f3;
      --bg-elevated: #ffffff;
      --ink: #1a1612;
      --ink-soft: #5a544c;
      --ink-faint: #8a8377;
      --gold: #b8893d;
      --line: #e6dfd1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      font-size: 17px;
    }

    .nav {
      background: var(--ink);
      color: var(--bg);
      padding: 1rem 2rem;
    }

    .nav-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav a {
      color: var(--bg);
      text-decoration: none;
      font-weight: 500;
    }

    .nav-brand {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-style: italic;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
    }

    .nav-links a {
      color: rgba(250, 248, 243, 0.7);
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--bg);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 2.75rem);
      line-height: 1.1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    h2 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 1.5rem;
      margin: 2.5rem 0 0.8rem;
      color: var(--ink);
    }

    h3 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      margin: 1.8rem 0 0.5rem;
      color: var(--ink);
    }

    p {
      margin-bottom: 1rem;
      color: var(--ink-soft);
    }

    strong {
      color: var(--ink);
      font-weight: 600;
    }

    ul,
    ol {
      margin: 0 0 1rem 1.5rem;
      color: var(--ink-soft);
    }

    li {
      margin-bottom: 0.4rem;
    }

    a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border 0.2s;
    }

    a:hover {
      border-bottom-color: var(--gold);
    }

    hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 3rem 0;
    }

    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88em;
      background: rgba(184, 137, 61, 0.1);
      padding: 0.15em 0.4em;
      border-radius: 3px;
      color: var(--ink);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.95rem;
    }

    th,
    td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--line);
    }

    th {
      font-weight: 600;
      color: var(--ink);
      background: rgba(184, 137, 61, 0.05);
    }

    td {
      color: var(--ink-soft);
    }

    .meta {
      color: var(--ink-faint);
      font-size: 0.9rem;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    .locale-switcher {
      text-align: center;
      padding: 2rem 0;
      border-top: 1px solid var(--line);
      margin-top: 4rem;
      color: var(--ink-faint);
      font-size: 0.85rem;
    }

    .locale-switcher a {
      margin: 0 0.4rem;
      color: var(--ink-soft);
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--ink-faint);
      font-size: 0.85rem;
    }

    [dir="rtl"] ul,
    [dir="rtl"] ol {
      margin: 0 1.5rem 1rem 0;
    }
  </style>
</head>

<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">Vellum</a>
      <div class="nav-links">
        <a href="/he/privacy/">פרטיות</a>
        <a href="/he/terms/">תנאים</a>
        <a href="/he/support/">תמיכה</a>
      </div>
    </div>
  </nav>

  <main>
    <h1>Vellum</h1>
    <p>כמוסות אודיו ווידאו לעתיד.</p>
    <p><a href="https://apps.apple.com/us/app/vellum-time-capsule/id6768291137">הורדה ב-App Store</a></p>
  </main>

  <footer>
    © 2026 Vellum · <a href="mailto:vellumcapsuleapp@gmail.com">vellumcapsuleapp@gmail.com</a>
  </footer>

</body>

</html>
