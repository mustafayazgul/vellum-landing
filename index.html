<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-itunes-app" content="app-id=YOUR_APP_ID">
    <title>Vellum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .container {
            max-width: 400px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: #999;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            background: #fff;
            color: #000;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Vellum</h1>
        <p>Geleceğindeki sana bir mesaj bırak.</p>
        <a href="https://apps.apple.com/app/idYOUR_APP_ID" class="button">App Store'da Aç</a>
    </div>
    <script>
        // Deeplink denemesi — uygulama yüklüyse açılır
        const urlParams = new URLSearchParams(window.location.search);
        const path = window.location.pathname;
        if (path !== '/' && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
            window.location.href = 'vellum://' + path.substring(1) + window.location.search;
        }
    </script>
</body>

</html>
